<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI活用の記録を見るページ。" />
    <title>AI活用の記録</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="トップへ戻る" data-i18n-attr="aria-label:brandAria">
        <span data-i18n="brand">個人ページ</span>
      </a>
      <nav class="nav" aria-label="ページ内ナビゲーション" data-i18n-attr="aria-label:navAria">
        <a href="./ai.html" data-i18n="navAi">AI活用</a>
        <a href="./life-learning.html" data-i18n="navLearning">生活・適応力・学習</a>
        <a href="./index.html#values" data-i18n="navValues">価値観</a>
      </nav>
      <div class="language-switcher" aria-label="Language selector">
        <button class="language-button active" type="button" data-lang="ja">日本語</button>
        <button class="language-button" type="button" data-lang="zh">中文</button>
        <button class="language-button" type="button" data-lang="en">English</button>
      </div>
    </header>

    <main id="top" class="detail-page note-page">
      <section class="detail-hero note-hero">
        <p class="eyebrow" id="ai-note-eyebrow">AI Notes</p>
        <h1 id="ai-note-title">考えの整理</h1>
        <p class="detail-copy" id="ai-note-copy">AI活用について、あとで公開内容にできるように草稿を書きます。</p>
      </section>

      <section class="section note-editor" aria-labelledby="ai-editor-title">
        <div class="section-heading split">
          <div>
            <p class="eyebrow">Notes</p>
            <h2 id="ai-editor-title">詳しい内容</h2>
            <p class="editor-help" id="ai-editor-help"></p>
          </div>
          <div class="editor-actions" hidden>
            <button class="button" type="button" id="ai-add-note">記録を追加</button>
            <button class="button" type="button" id="ai-export-note">バックアップを書き出す</button>
            <label class="button secondary import-button" for="ai-import-note">バックアップを読み込む</label>
            <input id="ai-import-note" type="file" accept="application/json,.json" />
            <button class="button secondary" type="button" id="ai-clear-note">本ページを空にする</button>
          </div>
        </div>
        <div class="note-list" id="ai-note-list"></div>
        <p class="save-status" id="ai-save-status" role="status"></p>
      </section>
    </main>

    <footer class="site-footer">
      <span data-i18n="footerLeft">個人ページ</span>
      <a href="./ai.html" data-i18n="backHome">トップページへ戻る</a>
    </footer>

    <script src="./app.js?v=20260703-public-view"></script>
    <script src="./ai-notes-data.js?v=20260703-public-view"></script>
    <script src="./ai-note.js?v=20260703-public-view"></script>
  </body>
</html>
