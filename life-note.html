<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="生活と学習の記録を編集するページ。" />
    <title>生活と学習の記録</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="トップへ戻る" data-i18n-attr="aria-label:brandAria">
        <span data-i18n="brand">個人ページ</span>
      </a>
      <nav class="nav" aria-label="ページ内ナビゲーション" data-i18n-attr="aria-label:navAria">
        <a href="./ai.html" data-i18n="navAi">AI活用</a>
        <a href="./life-learning.html" data-i18n="navLearning">生活・適応力・学習</a>
        <a href="./#values" data-i18n="navValues">価値観</a>
      </nav>
      <div class="language-switcher" aria-label="Language selector">
        <button class="language-button active" type="button" data-lang="ja">日本語</button>
        <button class="language-button" type="button" data-lang="zh">中文</button>
        <button class="language-button" type="button" data-lang="en">English</button>
      </div>
    </header>

    <main id="top" class="detail-page note-page">
      <section class="detail-hero note-hero">
        <p class="eyebrow" id="note-eyebrow">Life Journal</p>
        <h1 id="note-title">生活の安定</h1>
        <p class="detail-copy" id="note-copy">写真と短い文章で、生活や学習の記録を整理します。</p>
      </section>

      <section class="section note-editor" aria-labelledby="note-editor-title">
        <div class="section-heading split">
          <div>
            <p class="eyebrow" id="note-editor-eyebrow">Edit Notes</p>
            <h2 id="note-editor-title">写真と文章を追加する</h2>
            <p class="editor-help" id="editor-help">この編集内容は現在のブラウザに保存されます。バックアップ用に書き出すこともできます。</p>
          </div>
          <div class="editor-actions">
            <button class="button primary" id="add-note" type="button">記録を追加</button>
            <button class="button secondary" id="export-notes" type="button">バックアップを書き出す</button>
            <label class="button secondary import-button" for="import-notes">バックアップを読み込む</label>
            <input id="import-notes" type="file" accept="application/json,.json" />
            <button class="button secondary" id="clear-notes" type="button">本ページを空にする</button>
          </div>
        </div>
        <div class="note-list" id="note-list"></div>
        <p class="save-status" id="save-status" role="status"></p>
      </section>
    </main>

    <footer class="site-footer">
      <span data-i18n="footerLeft">個人ページ</span>
      <a href="./life-learning.html" data-i18n="backHome">トップページへ戻る</a>
    </footer>

    <script src="./app.js"></script>
    <script src="./life-notes-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="./life-note.js"></script>
  </body>
</html>
